# Arquivo de configuração de URLs para Download de Vídeos (.ini)
# Suporta links diretos, seções com pastas personalizadas e playlists!

[videos]
# Vídeo de demonstração Big Buck Bunny em MP4 (hospedado no GitHub)
video1 = https://raw.githubusercontent.com/mediaelement/mediaelement-files/master/big_buck_bunny.mp4
video2 = https://raw.githubusercontent.com/mediaelement/mediaelement-files/master/echo-hereweare.mp4

# Seção com nome de pasta personalizada: cria a subpasta 'Animacoes' em downloads
[Animacoes]
video_animado = https://raw.githubusercontent.com/mediaelement/mediaelement-files/master/big_buck_bunny.mp4

# Exemplo de URL de Playlist (YouTube) - criará uma subpasta com o nome da playlist!
[Playlists_YouTube]
playlist_exemplo = https://www.youtube.com/playlist?list=PLbzoR-pLrL6qucl8-lOnzvhFc2UM1tcZA
